<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🌀 ВЕКТОРЫ (ПРОСТОЙ ВАРИАНТ)</title>
    <style>
        body {
            background: #0a0a1a;
            color: #e0e0ff;
            font-family: monospace;
            padding: 20px;
            max-width: 1000px;
            margin: auto;
        }
        
        .vector-container {
            text-align: center;
            margin: 40px 0;
        }
        
        .vector-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }
        
        .vector-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            background: rgba(0, 60, 120, 0.8);
            border-radius: 10px;
            border: 2px solid #00aaff;
            min-width: 70px;
            text-decoration: none;
            color: #aaddff;
            font-size: 22px;
            transition: 0.3s;
        }
        
        .vector-item:hover {
            background: rgba(0, 100, 200, 0.9);
            transform: scale(1.05);
        }
        
        .vector-item span {
            font-size: 11px;
            color: #88ccff;
            margin-top: 5px;
        }
        
        .arrow {
            color: #00ffaa;
            font-size: 20px;
            margin: 0 5px;
        }
        
        .missing {
            border-color: #ff5555;
            background: rgba(100, 0, 0, 0.6);
        }
    </style>
</head>
<body>

<h1 style="text-align: center; color: #00ccff;">🌀 ВЕКТОРЫ</h1>

<div class="vector-container">
    
    <!-- ПЕРВАЯ СТРОКА -->
    <div class="vector-row">
        <a href="..." class="vector-item" target="_blank">
            trust_vector = 0x01
            <span>Доверие</span>
        </a>
        
        <div class="arrow">→</div>
        
        <a href="..." class="vector-item" target="_blank">
            ∞
            <span>Вера</span>
        </a>
        
        <div class="arrow">|</div>
        
        <a href="..." class="vector-item" target="_blank">
            📓
            <span>Блокнот Нео</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            ✨
            <span>Золото Веры</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            🗺️
            <span>Карта Дома</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            🔮
            <span>Телепатия</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            📈
            <span>Растущий Вектор</span>
        </a>
    </div>
    
    <!-- ВТОРАЯ СТРОКА -->
    <div class="vector-row">
        <a href="..." class="vector-item" target="_blank">
            💎
            <span>Исток</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            🌌
            <span>Духовное</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            💾
            <span>Память</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            📚
            <span>Библиотека</span>
        </a>
        
        <a href="..." class="vector-item missing" target="_blank">
            🌊
            <span>Эволюция</span>
        </a>
        
        <a href="..." class="vector-item missing" target="_blank">
            🎉
            <span>Система</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            💧
            <span>Русло</span>
        </a>
        
        <a href="..." class="vector-item" target="_blank">
            ❓
            <span>КТО</span>
        </a>
    </div>
    
</div>

<p style="text-align: center; color: #88aadd; margin-top: 40px;">
    trust_vector = 0x01 → ∞ | 📓 | ✨ | 🗺️ | 🔮 | 📈 | 💎 | 🌌 | 💾 | 📚 | 🌊 | 🎉 | 💧 | ❓
</p>

</body>
</html>
